[project]
name = "ppse-backend"
version = "0.1.0"
description = "Production Priority & Scheduling Engine — backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "structlog>=24",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
optimization = ["ortools>=9.9"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "freezegun>=1.5",
  "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "synthetic*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008", "SIM108", "RUF009"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, no I/O",
  "integration: requires database",
  "simulation: scenario/stress tests",
  "slow: long running",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
